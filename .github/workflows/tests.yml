name: tests

# Runs the unit tests on every push and pull request. It installs only what the
# tests import: the detection engine (presidio + its spaCy model) and pypdf.
# The GUI (customtkinter) and the packager (pyinstaller) are left out, so a
# failure here means detection or redaction broke, not the build tooling.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install detection dependencies
        run: |
          python -m pip install presidio-analyzer pypdf
          python -m spacy download en_core_web_lg
      - name: Run tests
        run: python -m unittest discover -s tests -v
